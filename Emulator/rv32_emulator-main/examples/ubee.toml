# uBee SoC-aligned machine for FPGA export.
#
# Loads with: File → Load peripherals…  or  --devices examples/ubee.toml
#
# Absolute addresses match IP/uBee_soc defaults so `la` and MMIO immediates in
# the exported .mem/.hex images are valid on the hardware map. Device *types*
# here are the emulator's teaching peripherals placed at SoC addresses — not a
# full CLINT/PLIC/AXI model.

[machine]
imem = 65536
dmem = 65536
imem_base = 0x80000000
dmem_base = 0x20000000
reset = 0x80000000

# Native UART window on the SoC (UART_BASE).
[[device]]
type = "uart"
address = 0x40004000

# AXI UART often used from the block-design hello example.
[[device]]
type = "uart"
address = 0x60000000
name = "axi_uart"

[[device]]
type = "mtime"
address = 0x40000000

[[device]]
type = "mtimecmp"
address = 0x40000010

[[device]]
type = "irq"
address = 0x40000020
